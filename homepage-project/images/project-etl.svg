<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">ETL pipeline diagram</title>
  <desc id="d2">A curved flow line running through three checkpoint nodes labelled extract, transform and load</desc>
  <rect width="320" height="200" fill="#131C2E"/>
  <path d="M30 150 C 90 150, 90 60, 160 60 C 230 60, 230 150, 290 150" fill="none" stroke="#3FBFAD" stroke-width="3" stroke-linecap="round"/>
  <circle cx="30" cy="150" r="7" fill="#E3A857"/>
  <circle cx="160" cy="60" r="7" fill="#3FBFAD"/>
  <circle cx="290" cy="150" r="7" fill="#E3A857"/>
  <text x="30" y="175" fill="#8FA0BE" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">extract</text>
  <text x="160" y="45" fill="#8FA0BE" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">transform</text>
  <text x="290" y="175" fill="#8FA0BE" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">load</text>
</svg>
